name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'

jobs:
  php:
    name: PHP – syntax, PHPStan, tests
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: zidle_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: root
      DB_NAME: zidle_test
      MAIL_ENABLED: '0'
      TICKET_SECRET: ci-ticket-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: gd, intl, pdo_mysql, mbstring
          tools: composer
          coverage: none
      - name: Composer install
        working-directory: api
        run: composer install --no-interaction --no-progress
      - name: Composer audit
        working-directory: api
        run: composer audit
      - name: Syntax check (php -l)
        run: find api tests -name '*.php' -not -path 'api/vendor/*' -print0 | xargs -0 -n1 php -l
      - name: PHPStan
        run: api/vendor/bin/phpstan analyse -c phpstan.neon --no-progress --error-format=github
      - name: Schema and migrations apply cleanly (twice)
        run: |
          mysql -h127.0.0.1 -uroot -proot -e 'DROP DATABASE IF EXISTS zidle_migrate; CREATE DATABASE zidle_migrate CHARACTER SET utf8mb4'
          mysql -h127.0.0.1 -uroot -proot zidle_migrate < db/schema.sql
          for round in 1 2; do
            for m in db/migrations/*.sql; do
              echo "round $round: $m"
              mysql -h127.0.0.1 -uroot -proot zidle_migrate < "$m"
            done
          done
      - name: Integration tests (payments, cancellation, VIP, GDPR, tickets)
        run: php tests/php/run.php

  frontend:
    name: Frontend – ESLint, build, PHP/JS consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
      - name: Layout and ticket format identical in PHP and JS
        run: npm run test:consistency

  e2e:
    name: E2E – Playwright
    runs-on: ubuntu-latest
    needs: [php, frontend]
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: zidle_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: root
      DB_NAME: zidle_test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: gd, intl, pdo_mysql, mbstring
          tools: composer
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Composer install
        working-directory: api
        run: composer install --no-dev --no-interaction --no-progress
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
